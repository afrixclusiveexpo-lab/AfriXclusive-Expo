name: I2V application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: I2V Exchange
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .local/browsers
      - run: npm run test:e2e
      - run: npm run export -w @i2v/mobile
      - run: python scripts/validate_pack.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            I2V Exchange/test-results
            I2V Exchange/package-lock.json
          retention-days: 7
